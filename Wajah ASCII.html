<style>

.ctl{position:fixed;left:calc(env(safe-area-inset-left,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:6px;flex-wrap:wrap}

.bar{display:flex;justify-content:space-between;background:var(--g);color:var(--ink);font-size:9px;letter-spacing:.1em;padding:3px 7px}
.scr{position:relative;aspect-ratio:4/3;background:#000}
.scr canvas,.scr video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scr video{opacity:0;pointer-events:none;transform:scaleX(-1)}
.scr video.fb{opacity:1;filter:grayscale(1) sepia(1) hue-rotate(95deg) saturate(3) contrast(1.2)}

.card p{margin:0 0 14px;font-size:12px;line-height:1.6;opacity:.8}
.card .row{display:flex;gap:8px;justify-content:center}
.card small{display:block;margin-top:12px;font-size:10px;opacity:.5}
#rot{display:none;z-index:9;background:#010403;flex-direction:column;gap:10px;color:var(--g);text-align:center;font-size:14px;letter-spacing:.1em}
#rot i{font-size:44px;font-style:normal}
@media (orientation:portrait){#rot{display:flex}}
@media (max-width:640px){header .mid{display:none}}

 [98,327].forEach(i=>blob(P[i],fw*.055,'0,0,0',.85));

function readout(){if(!face)return;const P=face.lm,fw=Math.hypot(P[234].x-P[454].x,P[234].y-P[454].y)||1,cl=x=>Math.max(0,Math.min(1,x));
